name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # La clé permanente vient du secret FIWICHAT_KEYSTORE (jamais dans le dépôt).
      # Sans elle, on ne publie rien : une version signée autrement ne pourrait pas
      # s'installer par-dessus l'ancienne.
      - name: Clé de signature permanente
        id: key
        env:
          FIWICHAT_KEYSTORE: ${{ secrets.FIWICHAT_KEYSTORE }}
        run: |
          if [ -z "$FIWICHAT_KEYSTORE" ]; then
            echo "haskey=false" >> "$GITHUB_OUTPUT"
          else
            echo "$FIWICHAT_KEYSTORE" | tr -d ' \r\n' | base64 -d > android/app/fiwichat.p12
            echo "haskey=true" >> "$GITHUB_OUTPUT"
          fi
      # Le numéro de version augmente à chaque construction : Android accepte la mise à jour.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk fiwichat.apk
          echo '{"build": ${{ github.run_number }}, "name": "1.0.${{ github.run_number }}"}' > version.json
          rm -f android/app/fiwichat.p12
      - uses: actions/upload-artifact@v4
        with:
          name: fiwichat-apk
          path: fiwichat.apk
      # Lien de téléchargement simple, à partager avec les amis :
      # https://github.com/<compte>/<dépôt>/releases/latest/download/fiwichat.apk
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.haskey == 'true'
        with:
          tag_name: derniere-version
          name: FIWICHAT (dernière version)
          body: Télécharge fiwichat.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: |
            fiwichat.apk
            version.json
          make_latest: true
      - name: Vérifier la clé
        if: steps.key.outputs.haskey != 'true'
        run: |
          echo "::error::L'appli a été construite mais PAS publiée : il manque le secret FIWICHAT_KEYSTORE (Settings > Secrets and variables > Actions)."
          exit 1
