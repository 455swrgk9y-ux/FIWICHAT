name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk fiwichat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fiwichat-apk
          path: fiwichat.apk
      # Lien de téléchargement simple, à partager avec les amis :
      # https://github.com/<compte>/<dépôt>/releases/latest/download/fiwichat.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: FIWICHAT (dernière version)
          body: Télécharge fiwichat.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: fiwichat.apk
          make_latest: true
